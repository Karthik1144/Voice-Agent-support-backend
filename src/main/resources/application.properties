spring.application.name=support-backend

# Points at the Postgres container started via docker-compose.yml / docker run
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/support}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:devpass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# No default on purpose - the app must fail to start rather than silently
# fall back to a hardcoded/leaked secret. Set WEBHOOK_SECRET in your
# environment or .env file (see .env.example).
webhook.secret=${WEBHOOK_SECRET}

server.port=8080
